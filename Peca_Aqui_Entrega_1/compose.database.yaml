name: peca-aqui
services:
  postgres:
    image: postgres:17-alpine
    container_name: peca-aqui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peca_aqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peca_aqui_somente_dev}
      POSTGRES_DB: ${POSTGRES_DB:-peca_aqui}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - peca_aqui_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  peca_aqui_pgdata:
